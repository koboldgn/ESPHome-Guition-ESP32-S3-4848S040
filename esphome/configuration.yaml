template:
  - trigger:
      - platform: time_pattern
        minutes: "/15"
      - platform: homeassistant
        event: start
    action:
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.csalad
            - calendar.esemenyek
            - calendar.kuka
        data:
          start_date_time: "{{ now().isoformat() }}"
          duration:
            days: 30
        response_variable: agenda
      - variables:
          raw_events: >
            {{ agenda.values() | selectattr('events', 'defined') | map(attribute='events') | sum(start=[]) }}
          events: >
            {% set ns = namespace(items=[]) %}
            {% for e in raw_events %}
              {% set s_dt = e.start | as_datetime %}
              {% if s_dt is not none %}
                {% set dt_short = s_dt | as_local | timestamp_custom('%m.%d. %H:%M') %}
                {% set text = e.summary | default('Nincs megnevezes') %}
                {% set ns.items = ns.items + [{
                  'display': dt_short ~ ' - ' ~ text,
                  'summary': text,
                  'start': s_dt | as_local | timestamp_custom('%Y-%m-%d %H:%M'),
                  'end': (e.end | as_datetime | as_local | timestamp_custom('%Y-%m-%d %H:%M')) if e.end is defined else '',
                  'dt': s_dt
                }] %}
              {% endif %}
            {% endfor %}
            {{ ns.items | sort(attribute='dt') }}
    sensor:
      - name: "Calendar Upcoming Event 1"
        unique_id: calendar_upcoming_event_1
        state: "{{ events[0].display if events | length > 0 else 'Nincs esemeny' }}"
        attributes:
          message:    "{{ events[0].summary if events | length > 0 else 'Nincs esemeny' }}"
          start_time: "{{ events[0].start if events | length > 0 else '' }}"
          end_time:   "{{ events[0].end if events | length > 0 else '' }}"

      - name: "Calendar Upcoming Event 2"
        unique_id: calendar_upcoming_event_2
        state: "{{ events[1].display if events | length > 1 else 'Nincs esemeny' }}"
        attributes:
          message:    "{{ events[1].summary if events | length > 1 else 'Nincs esemeny' }}"
          start_time: "{{ events[1].start if events | length > 1 else '' }}"
          end_time:   "{{ events[1].end if events | length > 1 else '' }}"

      - name: "Calendar Upcoming Event 3"
        unique_id: calendar_upcoming_event_3
        state: "{{ events[2].display if events | length > 2 else 'Nincs esemeny' }}"
        attributes:
          message:    "{{ events[2].summary if events | length > 2 else 'Nincs esemeny' }}"
          start_time: "{{ events[2].start if events | length > 2 else '' }}"
          end_time:   "{{ events[2].end if events | length > 2 else '' }}"

      - name: "Calendar Upcoming Event 4"
        unique_id: calendar_upcoming_event_4
        state: "{{ events[3].display if events | length > 3 else 'Nincs esemeny' }}"
        attributes:
          message:    "{{ events[3].summary if events | length > 3 else 'Nincs esemeny' }}"
          start_time: "{{ events[3].start if events | length > 3 else '' }}"
          end_time:   "{{ events[3].end if events | length > 3 else '' }}"